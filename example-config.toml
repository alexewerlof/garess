# garess configuration
#
# Discovered in this order (project overrides global):
#   1. global   ~/.config/garess/config.toml  (or $XDG_CONFIG_HOME/garess)
#   2. project  .garess/config.toml
#   3. root     config.toml                   (fallback when #2 is absent)
#
# Or point at a specific file with: garess --config <path>
#
# The API key may be omitted and provided via the GA_RESS_API_KEY environment
# variable, which takes precedence over the value in this file.
#
# Endpoints must include the /v1 prefix (llama.cpp, DeepSeek and OpenRouter
# all expose the OpenAI-compatible API under /v1).

default_provider = "llamacpp"

[[providers]]
name = "llamacpp"
endpoint = "http://127.0.0.1:8080/v1"   # local llama.cpp server
api_key = ""                            # llama.cpp needs no key
model = "qwen2.5-1.5b-instruct"
# context_window = 32768               # model context size in tokens (used for the
                                        # context usage indicator + auto-compress).
                                        # When unset (0), garess probes /v1/models
                                        # and falls back to 128k.

[[providers]]
name = "deepseek"
endpoint = "https://api.deepseek.com/v1"
api_key = "sk-..."                      # or use GA_RESS_API_KEY
model = "deepseek-chat"

[[providers]]
name = "openrouter"
endpoint = "https://openrouter.ai/api/v1"
api_key = "sk-or-..."
model = "deepseek/deepseek-chat"

[tui]
theme = "dark"                          # auto | dark | light

[session]
history_limit = 40                      # messages kept in the model context
# auto_compress_threshold = 80          # context usage % that triggers automatic
                                        # compression after a turn (0 = disable;
                                        # manual /compress always available)

# ---------------------------------------------------------------------------
# Git-style hooks (Phase 3). Optional — omit the whole section for no hooks.
#
# Each [[hooks]] entry fires a shell command when an agent event occurs. The
# command runs with `sh -c`; the event name is passed as $1 (argv[1]) and as
# the GARESS_HOOK_EVENT env var, and a JSON payload describing the event
# (session/tool/model/args/text, truncated for safety) is piped to stdin.
# stdout/stderr are captured and never touch the TUI.
#
# Blocking ("pre") events abort the operation when the hook exits non-zero:
#   before_run, on_user_message, before_agent, before_model, before_tool
# Notification events never abort (failures are logged as warnings):
#   after_run, after_agent, after_model, on_model_error,
#   after_tool, on_tool_error, on_event
#
# Project config replaces global hooks for the same event. `timeout` (Go
# duration) is optional; the default is 10s.
# ---------------------------------------------------------------------------
# [[hooks]]
# event = "before_tool"          # block risky tool calls: exit non-zero
# command = "/path/to/guard.sh"  #   to abort the tool (model sees the error)
# timeout = "5s"
#
# [[hooks]]
# event = "after_model"          # notification: log/model usage accounting
# command = "echo model done >> /tmp/garess-hooks.log"
#
# after_model fires once per model generation (on the final response), not
# once per streamed token.
#
# [[hooks]]
# event = "on_event"             # audit every completed session event
# command = "jq '{event, agent, tool}' > /tmp/garess-events.jsonl"

# ---------------------------------------------------------------------------
# Landlock tool sandbox (Phase 4). Optional — the default backend is "none".
#
# The sandbox confines WRITES to the whole garess process: files may be
# created/modified/removed only under the writable directories below. Reads
# and command execution stay unrestricted everywhere, so a coding agent can
# still inspect system files and run tools.
#
# backend:
#   none      - no sandboxing (default)
#   auto      - use Landlock when the kernel supports it, else fall back
#   landlock  - require Landlock; garess refuses to start if it cannot apply
#
# Needs Landlock ABI >= 6 (kernel >= 6.7) for process-wide enforcement.
# Kernels without Landlock — including every Raspberry Pi OS armv6 `rpi-v6`
# kernel (verified on 6.18.34+rpt-rpi-v6) — fall back to "none".
# GARESS_SANDBOX=none|auto|landlock overrides the backend per run.
#
# Writable by default: the project workdir (covers .garess/ state), /tmp, and
# the global ~/.config/garess dir. Add build caches or other locations here
# (e.g. ~/.cache for GOCACHE/pip). Project config replaces the global list.
# ---------------------------------------------------------------------------
# [sandbox]
# backend = "auto"
# write_dirs = ["/home/you/.cache"]

# ---------------------------------------------------------------------------
# MCP servers (Model Context Protocol). Optional — omit the whole section for
# no MCP tools. Each [[mcp_servers]] entry exposes a server's tools to the
# agent alongside the built-ins. An unreachable server is skipped for that
# turn (chat keeps working); `garess doctor` lists each server's tools.
#
# transport (required):
#   stdio  - spawn a local command (command + optional args/env)
#   sse    - connect to a Server-Sent Events endpoint (url)
#   http   - connect to a streamable HTTP endpoint (url)
#
# headers are sent on every request to sse/http servers (e.g. Authorization).
# The GARESS_MCP_<NAME>_TOKEN env var (NAME uppercased, non-alnum -> _) sets
# Authorization: Bearer <token> and wins over an inline header.
#
# Project config replaces the global entry with the same name.
# ---------------------------------------------------------------------------
# Remote server over SSE (e.g. a self-hosted Crawl4AI Docker server):
# [[mcp_servers]]
# name = "crawl4ai"
# transport = "sse"
# url = "http://crawl-host:11235/mcp/sse"
# headers = { Authorization = "Bearer your-token" }
#
# Local subprocess server (stdio):
# [[mcp_servers]]
# name = "filesystem"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

